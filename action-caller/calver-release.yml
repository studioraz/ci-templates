name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-calver-release:
    uses: studioraz/ci-templates/.github/workflows/calver-release.yml@master
    secrets:
      # Optional PAT / GitHub App token; without it CI does not run on the release PR.
      token: ${{ secrets.RELEASE_TOKEN }}

