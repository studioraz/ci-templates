name: Update Composer Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Composer package (e.g. vendor/package)"
        type: string
        required: true
      version:
        description: "Version/constraint (e.g. ^3.2 or 3.2.1). Leave blank for latest allowed."
        type: string
        required: false
        default: ""
      base-branch:
        description: "Base branch to open the PR against"
        type: string
        required: false
        default: "master"
      pr-title:
        description: "Override PR title"
        type: string
        required: false
        default: ""
      pr-body:
        description: "Override PR body"
        type: string
        required: false
        default: ""
      force-pr:
        description: "Open PR even if only composer.json changed, but lock did not"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  call-updater:
    uses: studioraz/ci-templates/.github/workflows/update-composer-package.yml@master
    with:
      package: ${{ github.event.inputs.package }}
      version: ${{ github.event.inputs.version }}
      base-branch: ${{ github.event.inputs['base-branch'] }}
      pr-title: ${{ github.event.inputs['pr-title'] }}
      pr-body: ${{ github.event.inputs['pr-body'] }}
      force-pr: ${{ github.event.inputs['force-pr'] == 'true' }}
      php-version: ${{ vars.PHP_VERSION || '8.3' }}
    secrets: inherit
