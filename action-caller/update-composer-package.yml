name: Update Composer Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Composer package (e.g. vendor/package or * for all)"
        type: string
        required: true
      version:
        description: "Version/constraint (e.g. ^3.2 or 3.2.1). Leave blank for latest allowed."
        type: string
        required: false
        default: ""
      target:
        description: "Apply via PR (create branch & PR) or inplace (push to current branch)"
        type: choice
        options: [pr, inplace]
        default: pr
      feature-branch:
        description: "(PR mode) Custom feature branch name (leave blank to auto-generate)"
        type: string
        required: false
        default: ""
      pr-title:
        description: "(PR mode) Override PR title"
        type: string
        required: false
        default: ""
      pr-body:
        description: "(PR mode) Override PR body"
        type: string
        required: false
        default: ""
      force-pr:
        description: "(PR mode) Open PR even if only composer.json changed but lock did not"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  call-updater:
    uses: studioraz/ci-templates/.github/workflows/update-composer-package.yml@master
    with:
      package: ${{ github.event.inputs.package }}
      version: ${{ github.event.inputs.version }}
      target: ${{ github.event.inputs.target }}
      feature-branch: ${{ github.event.inputs['feature-branch'] }}
      pr-title: ${{ github.event.inputs['pr-title'] }}
      pr-body: ${{ github.event.inputs['pr-body'] }}
      force-pr: ${{ github.event.inputs['force-pr'] == 'true' }}
      php-version: ${{ vars.PHP_VERSION || '8.3' }}
      with-all-dependencies: ${{ vars.COMPOSER_WITH_ALL_DEPS || false }}
    secrets: inherit
