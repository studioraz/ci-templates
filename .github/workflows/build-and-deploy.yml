name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: string
      php-version:
        description: PHP version
        required: true
        default: '8.3'
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve Slack webhook URL
        run: |
          if [[ "${{ inputs.environment }}" == "production" && -n "${{ vars.SLACK_WEBHOOK_DEPLOY_PRODUCTION }}" ]]; then
            echo "SLACK_WEBHOOK=${{ vars.SLACK_WEBHOOK_DEPLOY_PRODUCTION }}" >> "$GITHUB_ENV"
          else
            echo "SLACK_WEBHOOK=${{ vars.SLACK_WEBHOOK_DEPLOY_STAGING }}" >> "$GITHUB_ENV"
          fi

      - name: Notify Slack — Started
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#2196F3",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": ":rocket: ${{ github.repository }} — started", "emoji": true },
                      "level": 3
                    },
                    {
                       "type": "divider"
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                        { "type": "mrkdwn", "text": "*Ref:*\n`${{ github.ref_name }}`" },
                        { "type": "mrkdwn", "text": "*Environment:*\n${{ inputs.environment }}" },
                        { "type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "View Run", "emoji": true },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          extensions: |
            none, xml, bcmath, ctype, curl, dom, gd, intl, mbstring, openssl, pdo_mysql, SimpleXML,
            soap, xsl, zip, iconv, xmlwriter, fileinfo, tokenizer, sockets, posix, ftp, xmlreader
          ini-values: |
            memory_limit=-1
            opcache.enable_cli=1
            opcache.jit_buffer_size=512M

      - name: Install Deployer globally
        run: |
          composer config --global repositories.packagist.org composer https://packagist.org
          composer global require studioraz/deployer-magento

      - name: Cache Composer vendor directory
        id: vendor-cache
        uses: actions/cache@v5
        with:
          path: ./vendor
          key: composer-cache-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            vendor-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Get Composer cache dir
        if: ${{ !steps.vendor-cache.outputs.cache-hit }}
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir --working-dir=.)" >> $GITHUB_OUTPUT

      - name: Cache Composer cache directory
        if: ${{ !steps.vendor-cache.outputs.cache-hit }}
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-cache-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-cache-

      - name: Install Composer dependencies
        if: ${{ !steps.vendor-cache.outputs.cache-hit }}
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader
        working-directory: .

      - name: Cache Magento-generated code
        id: magento-di-cache
        uses: actions/cache@v5
        with:
          path: |
            ./generated
          key: di-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Compile Magento DI
        if: ${{ !steps.magento-di-cache.outputs.cache-hit }}
        run: bin/magento setup:di:compile --no-ansi --no-interaction
        working-directory: .

      - name: Build
        uses: deployphp/action@v1
        with:
          deployer-binary: /home/runner/.composer/vendor/bin/dep
          dep: artifact:build localhost
          private-key: ${{ secrets.SSH_CONNECTION_PRIVATE_KEY }}
          skip-ssh-setup: false
      - name: Notify Slack — Build Finished
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#f7df05",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": ":hammer: ${{ github.repository }} — build finished", "emoji": true },
                      "level": 3
                    }                                  
                  ]
                }
              ]
            }
      - name: Deploy
        uses: deployphp/action@v1
        with:
          deployer-binary: /home/runner/.composer/vendor/bin/dep
          dep: artifact:deploy ${{ inputs.environment }}
          skip-ssh-setup: true

      - name: Notify Slack — Success
        if: success()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#2EB67D",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": ":white_check_mark: ${{ github.repository }} - deploy finished", "emoji": true },
                      "level": 3
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack — Failed
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#E01E5A",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": ":x: ${{ github.repository }} — deploy failed", "emoji": true },
                      "level": 3
                    },
                    {
                       "type": "divider"
                    },      
                    {
                      "type": "section",
                      "text": { "type": "mrkdwn", "text": ":warning: The workflow failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check the run logs> for error details." }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "View Run", "emoji": true },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
