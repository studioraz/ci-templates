# CI for this repository itself (not a reusable workflow).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find actions tests -name '*.sh' -print0 | xargs -0 shellcheck

  test-calver-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/calver-release/run.sh
