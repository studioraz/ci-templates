name: Agents Sync

on:
  workflow_call:
    inputs:
      base-branch:
        description: "Branch to sync (defaults to the repository default branch)"
        required: false
        type: string
        default: ""
      agents-file:
        description: "Instructions file to manage"
        required: false
        type: string
        default: "AGENTS.md"
      claude-md:
        description: "Create or update CLAUDE.md so it imports the instructions file"
        required: false
        type: boolean
        default: true
    secrets:
      token:
        description: "PAT or GitHub App token (falls back to GITHUB_TOKEN). Needed for CI to run on the sync PR."
        required: false

jobs:
  agents-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: agents-sync-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
      SYNC_BRANCH: ci-templates/agents-sync
      TITLE: "chore(agents): sync org agent instructions"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.token || github.token }}

      - name: Update instructions
        uses: studioraz/ci-templates/actions/agents-sync@feat/agents-sync
        with:
          agents-file: ${{ inputs.agents-file }}
          claude-md: ${{ inputs.claude-md }}

      - name: Open or update sync PR
        env:
          AGENTS_FILE: ${{ inputs.agents-file }}
        run: |
          pr="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"

          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::notice::Agent instructions are up to date"
            if [[ -n "$pr" ]]; then
              gh pr close "$pr" --delete-branch --comment "Instructions are already up to date."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A
          git commit -q -m "$TITLE"
          # Skip the push (and PR noise) when the open PR already has this content.
          if git fetch -q origin "$SYNC_BRANCH" 2>/dev/null && [[ -n "$pr" ]] && git diff --quiet FETCH_HEAD HEAD; then
            echo "::notice::Sync PR #$pr is already up to date"
            exit 0
          fi
          git push --force origin "$SYNC_BRANCH"

          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Updates the organization agent instructions from [studioraz/ci-templates](https://github.com/studioraz/ci-templates/blob/master/actions/agents-sync/AGENTS.base.md)." \
            "Only the managed block in \`$AGENTS_FILE\` (and the \`CLAUDE.md\` import) is changed; the *Project specifics* section is untouched. To change the organization rules, open a PR in ci-templates instead of editing the block here." \
            "Generated by the agents-sync workflow.")"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$TITLE" --body "$body"
            echo "::notice::Updated agents sync PR #$pr"
          else
            gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "$TITLE" --body "$body"
          fi
