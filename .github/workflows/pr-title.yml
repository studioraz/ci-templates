name: Validate PR title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges put the PR title on the base branch as the commit subject,
      # which calver-release.yml turns into a changelog entry.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
