name: Validate PR title

on:
  workflow_call:
    inputs:
      types:
        description: "Allowed types, one regex per line (empty: the Conventional Commit types)"
        required: false
        type: string
        default: ""
      scopes:
        description: "Allowed scopes, one regex per line (empty: any scope)"
        required: false
        type: string
        default: ""
      require-scope:
        description: "Require a scope"
        required: false
        type: boolean
        default: false
      subject-pattern:
        description: "Regex the subject must match (empty: any subject)"
        required: false
        type: string
        default: ""
      subject-pattern-error:
        description: "Error shown when subject-pattern does not match"
        required: false
        type: string
        default: ""
      validate-single-commit:
        description: "For one-commit PRs also validate the commit message, which GitHub suggests for the squash commit"
        required: false
        type: boolean
        default: false
      single-commit-matches-title:
        description: "With validate-single-commit, also require that commit message to equal the PR title"
        required: false
        type: boolean
        default: false
      wip:
        description: "Keep the check pending for titles starting with [WIP] (needs statuses: write)"
        required: false
        type: boolean
        default: false
      ignore-labels:
        description: "Labels that skip validation, one per line (caller must also trigger on labeled/unlabeled)"
        required: false
        type: string
        default: ""
      comment:
        description: "Post the error as a PR comment and remove it once the title is fixed (needs pull-requests: write)"
        required: false
        type: boolean
        default: false

# No permissions here: the caller's grant applies. The check needs pull-requests: read;
# `comment` needs pull-requests: write and `wip` needs statuses: write.

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges put the PR title on the base branch as the commit subject,
      # which release-calver.yml and release-please.yml turn into a changelog entry.
      - uses: amannn/action-semantic-pull-request@v6
        id: lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
          validateSingleCommit: ${{ inputs.validate-single-commit }}
          validateSingleCommitMatchesPrTitle: ${{ inputs.single-commit-matches-title }}
          wip: ${{ inputs.wip }}
          ignoreLabels: ${{ inputs.ignore-labels }}

      - name: Comment the error
        if: always() && inputs.comment && steps.lint.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-lint-error
          message: |
            The PR title must be a [Conventional Commit](https://www.conventionalcommits.org/en/v1.0.0/),
            because the squash commit drives the version bump and the changelog. Please adjust it.

            ```
            ${{ steps.lint.outputs.error_message }}
            ```

      - name: Remove the error comment
        if: inputs.comment && steps.lint.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-lint-error
          delete: true
