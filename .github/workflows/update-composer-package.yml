name: Update Composer Package & Open PR (Reusable)

on:
  workflow_call:
    inputs:
      package:
        description: "Composer package (e.g. vendor/package)"
        type: string
        required: true
      version:
        description: "Version/constraint (e.g. ^3.2 or 3.2.1). Leave blank for latest allowed."
        type: string
        required: false
        default: ""
      base-branch:
        description: "Base branch to open the PR against"
        type: string
        required: false
        default: "master"
      pr-title:
        description: "Override PR title"
        type: string
        required: false
        default: ""
      pr-body:
        description: "Override PR body"
        type: string
        required: false
        default: ""
      php-version:
        description: "PHP version for Composer"
        type: string
        required: false
        default: "8.1"
      working-directory:
        description: "Path where composer.json lives (monorepos)."
        type: string
        required: false
        default: "."
      force-pr:
        description: "Open PR even if only composer.json changed but lock did not"
        type: boolean
        required: false
        default: false
    secrets:
      token:
        required: false
        description: "PAT with repo scope (optional; defaults to GITHUB_TOKEN)"

permissions:
  contents: write
  pull-requests: write

env:
  COMPOSER_PROCESS_TIMEOUT: "0"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "1"

jobs:
  update-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs['base-branch'] }}

      - name: Set up PHP (for Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs['php-version'] }}
          tools: composer

      - name: Configure Composer auth from project (optional)
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          if [ -f ./auth.json ]; then
            SRC=./auth.json
          elif [ -f ./src/auth.json ]; then
            SRC=./src/auth.json
          else
            SRC=""
          fi
          if [ -n "$SRC" ]; then
            mkdir -p "$HOME/.composer"
            cp "$SRC" "$HOME/.composer/auth.json"
            echo "Using $SRC for Composer authentication."
          else
            echo "No project auth.json found, proceeding without custom Composer auth."
          fi

      - name: Create update branch name
        id: branch
        run: |
          set -euo pipefail
          SAFE_PKG=$(echo "${{ inputs.package }}" | tr '/:@' '---' | tr '[:upper:]' '[:lower:]')
          TS=$(date +%Y%m%d%H%M%S)
          if [ -n "${{ inputs.version }}" ]; then
            SAFE_VER=$(echo "${{ inputs.version }}" | tr '/:@^~*<>= ' '------' )
            BR="chore/update-${SAFE_PKG}-${SAFE_VER}-${TS}"
          else
            BR="chore/update-${SAFE_PKG}-latest-${TS}"
          fi
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Create branch from base
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.name }}" "${{ inputs.base-branch }}"

      - name: Capture pre-update checksums
        id: before
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          set -euo pipefail
          for f in composer.json composer.lock; do
            if [ -f "$f" ]; then
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "pre_${f%.*}_sha=$sha" >> "$GITHUB_OUTPUT"
            else
              echo "pre_${f%.*}_sha=absent" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Update package & resolve deps (lock only)
        id: update
        working-directory: ${{ inputs['working-directory'] }}
        env:
          PKG: ${{ inputs.package }}
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # What version is currently locked (if any)?
          OLD_VER="$(composer show --locked "$PKG" 2>/dev/null | awk -F': ' '/^versions/{print $2}' | awk -F', ' '{print $1}' || true)"
          echo "old_version=$OLD_VER" >> "$GITHUB_OUTPUT"

          if [ -n "$VER" ]; then
            echo "Requiring $PKG:$VER with --no-install"
            composer require "$PKG:$VER" --no-interaction --no-progress --no-install
            composer update "$PKG" --no-interaction --no-progress --no-install
          else
            echo "Requiring latest allowed for $PKG with --no-install"
            composer require "$PKG" --no-interaction --no-progress --no-install
            composer update "$PKG" --no-interaction --no-progress --no-install
          fi

          NEW_VER="$(composer show --locked "$PKG" 2>/dev/null | awk -F': ' '/^versions/{print $2}' | awk -F', ' '{print $1}' || true)"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Show changed files (debug)
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          git status --porcelain
          git diff --name-status || true

      - name: Detect changes via checksums
        id: changed
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          set -euo pipefail
          post_json_sha=absent
          post_lock_sha=absent
          [ -f composer.json ] && post_json_sha=$(sha256sum composer.json | awk '{print $1}')
          [ -f composer.lock ] && post_lock_sha=$(sha256sum composer.lock | awk '{print $1}')

          has_changes=false
          changed_files=""
          if [ "${{ steps.before.outputs.pre_composer_sha }}" != "$post_json_sha" ]; then
            has_changes=true
            changed_files="$changed_files composer.json"
          fi
          if [ "${{ steps.before.outputs.pre_composer_sha }}" = "" ]; then :; fi

          if [ "${{ steps.before.outputs.pre_composer_sha }}" = "absent" ] && [ -f composer.json ]; then
            has_changes=true
          fi

          if [ "${{ steps.before.outputs.pre_composer_sha }}" = "absent" ] && [ -f composer.lock ]; then
            has_changes=true
          fi

          if [ "${{ steps.before.outputs.pre_composer_lock_sha }}" != "$post_lock_sha" ]; then
            has_changes=true
            changed_files="$changed_files composer.lock"
          fi

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Compute PR metadata
        id: meta
        env:
          OLD: ${{ steps.update.outputs.old_version }}
          NEW: ${{ steps.update.outputs.new_version }}
          PKG: ${{ inputs.package }}
          IN_TITLE: ${{ inputs.pr-title }}
          IN_BODY: ${{ inputs.pr-body }}
        run: |
          set -euo pipefail
          if [ -n "${IN_TITLE}" ]; then
            TITLE="${IN_TITLE}"
          else
            if [ -n "${OLD}" ] && [ -n "${NEW}" ] && [ "${OLD}" != "${NEW}" ]; then
              TITLE="chore(composer): bump ${PKG} from ${OLD} to ${NEW}"
            elif [ -n "${NEW}" ]; then
              TITLE="chore(composer): update ${PKG} to ${NEW}"
            else
              TITLE="chore(composer): update ${PKG}"
            fi
          fi

          if [ -n "${IN_BODY}" ]; then
            BODY="${IN_BODY}"
          else
            if [ -n "${OLD}" ] && [ -n "${NEW}" ] && [ "${OLD}" != "${NEW}" ]; then
              BODY="This PR updates ${PKG} from ${OLD} to ${NEW} and refreshes composer.lock (no vendor install)."
            else
              BODY="This PR updates the package constraint and refreshes composer.lock (no vendor install)."
            fi
          fi

          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Commit changes (if any)
        id: commit
        working-directory: ${{ inputs['working-directory'] }}
        env:
          FORCE_PR: ${{ inputs['force-pr'] }}
        run: |
          set -euo pipefail
          has_changes=${{ steps.changed.outputs.has_changes }}

          if [ "$has_changes" = "true" ] || [ "$FORCE_PR" = "true" ]; then
            git add composer.json composer.lock 2>/dev/null || true
            if git diff --cached --quiet -- composer.json composer.lock; then
              echo "No staged changes in composer files, but FORCE_PR=$FORCE_PR"
            fi
            git -C "${{ inputs['working-directory'] }}" commit -m "${{ steps.meta.outputs.commit_message }}" || echo "Nothing to commit"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file checksum changes detected; skipping commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open Pull Request
        if: steps.commit.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.token || github.token }}
          base: ${{ inputs.base-branch }}
          branch: ${{ steps.branch.outputs.name }}
          title: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          commit-message: ${{ steps.meta.outputs.commit_message }}
          labels: dependencies, composer
          draft: false
