name: Update Composer Package & Open PR (Reusable)

on:
  workflow_call:
    inputs:
      package:
        description: "Composer package name (e.g. vendor/package)"
        type: string
        required: true
      version:
        description: "Version/constraint (e.g. ^2.3 or 2.3.1). Leave blank for latest allowed."
        type: string
        required: false
        default: ""
      base-branch:
        description: "Base branch to open the PR against"
        type: string
        required: false
        default: "master"
      pr-title:
        description: "Custom PR title (optional)"
        type: string
        required: false
        default: ""
      pr-body:
        description: "Custom PR body (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-package:
    runs-on: ubuntu-latest
    env:
      # Allow project to control PHP version (then fall back to org/repo vars, then a default)
      PHP_VERSION: ${{ env.PHP_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}

      - name: Set up PHP (for Composer)
        uses: shivammathur/setup-php@v2
        with:
          # Try env.PHP_VERSION, then vars.PHP_VERSION, then default
          php-version: ${{ env.PHP_VERSION != '' && env.PHP_VERSION || vars.PHP_VERSION != '' && vars.PHP_VERSION || '8.1' }}
          tools: composer

      - name: Detect working directory (composer.json)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # Find first tracked composer.json (ignore vendor/)
          DIR=$(git ls-files -- "**/composer.json" | grep -v '^vendor/' | head -n1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "No composer.json found in repository" >&2
            exit 1
          fi
          echo "WORKDIR=$DIR" >> "$GITHUB_ENV"
          echo "Detected composer working directory: $DIR"

      - name: Configure Composer auth (auto-detected)
        shell: bash
        run: |
          set -euo pipefail
          # Prefer auth.json next to composer.json (WORKDIR), then repo root, then ./src
          CANDIDATES=("${WORKDIR}/auth.json" "./auth.json" "./src/auth.json")
          SRC=""
          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              SRC="$f"; break
            fi
          done
          if [ -n "$SRC" ]; then
            mkdir -p "$HOME/.composer"
            cp "$SRC" "$HOME/.composer/auth.json"
            echo "Using $SRC for Composer authentication."
          else
            echo "No auth.json found, proceeding without custom Composer auth."
          fi

      - name: Create update branch name
        id: branch
        shell: bash
        run: |
          SAFE_PKG=$(echo "${{ inputs.package }}" | tr '/:@' '---' | tr '[:upper:]' '[:lower:]')
          TS=$(date +%Y%m%d%H%M%S)
          if [ -n "${{ inputs.version }}" ]; then
            SAFE_VER=$(echo "${{ inputs.version }}" | tr '/:@^~*<>= ' '------' )
            BRANCH="chore/update-${SAFE_PKG}-${SAFE_VER}-${TS}"
          else
            BRANCH="chore/update-${SAFE_PKG}-latest-${TS}"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create branch from base
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.name }}" "${{ inputs.base-branch }}"

      - name: Determine current locked version
        id: before
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="${{ inputs.package }}"
          # Extract first listed version, strip any leading '*' and spaces (Composer shows "versions : * 1.2.3, ...")
          OLD_VER=$(composer show --locked "$PKG" 2>/dev/null \
            | awk -F': ' '/^versions/{print $2}' \
            | sed -E 's/^\\*\\s*//' \
            | awk -F', ' '{print $1}' || true)
          echo "old_version=$OLD_VER" >> "$GITHUB_OUTPUT"

      - name: Update package with Composer (no install)
        id: update
        env:
          PKG: ${{ inputs.package }}
          VER: ${{ inputs.version }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VER}" ]; then
            echo "Requiring ${PKG}:${VER} with lock update only"
            composer require "${PKG}:${VER}" --no-interaction --no-progress --no-install
            composer update "${PKG}" --no-interaction --no-progress --no-install
          else
            echo "Requiring latest allowed for ${PKG} with lock update only"
            composer require "${PKG}" --no-interaction --no-progress --no-install
            composer update "${PKG}" --no-interaction --no-progress --no-install
          fi

      - name: Determine new locked version
        id: after
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="${{ inputs.package }}"
          NEW_VER=$(composer show --locked "$PKG" 2>/dev/null \
            | awk -F': ' '/^versions/{print $2}' \
            | sed -E 's/^\\*\\s*//' \
            | awk -F', ' '{print $1}' || true)
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Compute PR metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PKG="${{ inputs.package }}"
          OLD="${{ steps.before.outputs.old_version }}"
          NEW="${{ steps.after.outputs.new_version }}"
          # Build title/body/commit using either provided inputs or auto text
          if [ -n "${{ inputs.pr-title }}" ]; then
            TITLE="${{ inputs.pr-title }}"
          else
            if [ -n "$OLD" ] && [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
              TITLE="chore(composer): bump ${PKG} from ${OLD} to ${NEW}"
            elif [ -n "$NEW" ]; then
              TITLE="chore(composer): update ${PKG} to ${NEW}"
            else
              TITLE="chore(composer): update ${PKG}"
            fi
          fi

          if [ -n "${{ inputs.pr-body }}" ]; then
            BODY="${{ inputs.pr-body }}"
          else
            if [ -n "$OLD" ] && [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
              BODY="This PR updates ${PKG} from ${OLD} to ${NEW} and refreshes composer.lock (no vendor install)."
            else
              BODY="This PR updates the package constraint and refreshes composer.lock (no vendor install)."
            fi
          fi

          if [ -n "$OLD" ] && [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
            COMMIT_MSG="chore(composer): bump ${PKG} from ${OLD} to ${NEW}"
          elif [ -n "$NEW" ]; then
            COMMIT_MSG="chore(composer): update ${PKG} to ${NEW}"
          else
            COMMIT_MSG="chore(composer): update ${PKG}"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "commit_message=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Commit changes (if any)
        env:
          WORKDIR: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          # Only care about composer files in WORKDIR
          CHANGED=0
          if ! git diff --quiet -- "$WORKDIR/composer.json"; then CHANGED=1; fi
          if ! git diff --quiet -- "$WORKDIR/composer.lock"; then CHANGED=1; fi

          if [ "$CHANGED" -eq 1 ]; then
            git add "$WORKDIR/composer.json" "$WORKDIR/composer.lock" || true
            git commit -m "${{ steps.meta.outputs.commit_message }}"
          else
            echo "No composer changes detected; nothing to commit."
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        shell: bash
        run: |
          set -euo pipefail
          AHEAD=$(git rev-list --left-right --count "${{ inputs.base-branch }}...HEAD" | awk '{print $2}')
          if [ "$AHEAD" -gt 0 ]; then
            git push --set-upstream origin "${{ steps.branch.outputs.name }}"
          else
            echo "Nothing to push."
          fi

      - name: Open Pull Request
        if: ${{ success() }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base-branch }}
          branch: ${{ steps.branch.outputs.name }}
          title: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          commit-message: ${{ steps.meta.outputs.commit_message }}
          labels: dependencies, composer
          draft: false
