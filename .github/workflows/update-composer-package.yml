name: Update Composer Package & Open PR (Reusable)

on:
  workflow_call:
    inputs:
      package:
        description: "Composer package (e.g. vendor/package or * for all packages)"
        type: string
        required: true
      version:
        description: "Version/constraint (ignored when package is *). Leave blank for latest allowed."
        type: string
        required: false
        default: ""
      base-branch:
        description: "Base branch to open the PR against (when target=pr)"
        type: string
        required: false
        default: "master"
      feature-branch:
        description: "Custom feature branch name (when target=pr). Leave blank to auto-generate."
        type: string
        required: false
        default: ""
      target:
        description: "Where to apply the update: 'pr' (create branch & PR) or 'inplace' (push to the branch this workflow runs on)"
        type: string
        required: false
        default: "pr"
      pr-title:
        description: "Override PR title (target=pr only)"
        type: string
        required: false
        default: ""
      pr-body:
        description: "Override PR body (target=pr only)"
        type: string
        required: false
        default: ""
      force-pr:
        description: "Open PR even if only composer.json changed but lock did not (target=pr only)"
        type: boolean
        required: false
        default: false
      php-version:
        description: "PHP version to use for Composer."
        type: string
        required: false
        default: "8.3"
      with-all-dependencies:
        description: "If true, run composer update <pkg> --with-all-dependencies."
        type: boolean
        required: false
        default: false
    secrets:
      token:
        required: false
        description: "PAT with repo scope (optional; defaults to GITHUB_TOKEN)"

permissions:
  contents: write
  pull-requests: write

env:
  COMPOSER_PROCESS_TIMEOUT: "0"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_AUDIT: "1"

jobs:
  update-package:
    runs-on: ubuntu-latest

    steps:
      - name: Determine target branch context
        id: ctx
        shell: bash
        run: |
          # Branch this workflow is running against (for 'inplace' mode)
          # Prefer GITHUB_HEAD_REF on PRs, otherwise use GITHUB_REF_NAME
          CUR="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "current_branch=${CUR}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # In PR mode we start from base-branch; in inplace we check out the current branch
          ref: ${{ inputs.target == 'pr' && inputs['base-branch'] || steps.ctx.outputs.current_branch }}

      - name: Set up PHP (for Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs['php-version'] }}
          tools: composer
          coverage: none
          ini-values: memory_limit=-1

      - name: Configure Composer auth from project (optional)
        shell: bash
        run: |
          set -e
          SRC=""
          for p in ./auth.json ./src/auth.json; do
            [[ -f "$p" ]] && SRC="$p" && break
          done
          if [[ -n "$SRC" ]]; then
            mkdir -p "$HOME/.composer"
            cp "$SRC" "$HOME/.composer/auth.json"
            echo "Using $SRC for Composer authentication."
          else
            echo "No project auth.json found; proceeding without custom Composer auth."
          fi

      - name: Detect working directory
        id: workdir
        shell: bash
        run: |
          if [[ -f composer.json ]]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [[ -f src/composer.json ]]; then
            echo "path=src" >> $GITHUB_OUTPUT
          else
            echo "composer.json not found" >&2
            exit 1
          fi

      - name: Compute/choose feature branch (PR mode)
        id: branch
        if: ${{ inputs.target == 'pr' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs['feature-branch'] }}" ]]; then
            BR="${{ inputs['feature-branch'] }}"
          else
            # Auto-generate from package/version
            if [[ "${{ inputs.package }}" == "*" ]]; then
              SAFE_PKG="all-packages"
            else
              SAFE_PKG="$(echo "${{ inputs.package }}" | tr '/:@' '---' | tr '[:upper:]' '[:lower:]')"
            fi
            TS=$(date +%Y%m%d%H%M%S)
            if [[ -n "${{ inputs.version }}" && "${{ inputs.package }}" != "*" ]]; then
              SAFE_VER="$(echo "${{ inputs.version }}" | tr '/:@^~*<>= ' '------' )"
              BR="chore/update-${SAFE_PKG}-${SAFE_VER}-${TS}"
            else
              BR="chore/update-${SAFE_PKG}-latest-${TS}"
            fi
          fi
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Create & switch to feature branch (PR mode)
        if: ${{ inputs.target == 'pr' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ inputs['base-branch'] }}" --prune
          git checkout -B "${{ steps.branch.outputs.name }}" "origin/${{ inputs['base-branch'] }}"

      - name: Ensure we are on the current branch (inplace mode)
        if: ${{ inputs.target != 'pr' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${{ steps.ctx.outputs.current_branch }}"
          git fetch origin "$BR" --prune || true
          # Checkout the branch by name (creates local branch tracking origin/BR if needed)
          git checkout -B "$BR" "origin/$BR" || git checkout -B "$BR"
          echo "Operating inplace on branch: $BR"

      - name: Capture pre-update checksums
        id: before
        working-directory: ${{ steps.workdir.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          for f in composer.json composer.lock; do
            if [[ -f "$f" ]]; then
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "pre_${f%.*}_sha=$sha" >> "$GITHUB_OUTPUT"
            else
              echo "pre_${f%.*}_sha=absent" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Update package & resolve deps (lock only)
        id: update
        working-directory: ${{ steps.workdir.outputs.path }}
        env:
          PKG: ${{ inputs.package }}
          VER: ${{ inputs.version }}
          WITH_ALL_DEPS: ${{ inputs['with-all-dependencies'] }}
        shell: bash
        run: |
          set -euo pipefail

          FLAG=""
          if [[ "${WITH_ALL_DEPS}" == "true" ]]; then
            FLAG="--with-all-dependencies"
          fi

          if [[ "$PKG" == "*" ]]; then
            composer update --no-interaction --no-progress --no-install $FLAG
          else
            OLD_VER="$(composer show --locked "$PKG" 2>/dev/null | awk -F': ' '/^versions/{print $2}' | awk -F', ' '{print $1}' || true)"
            echo "old_version=$OLD_VER" >> "$GITHUB_OUTPUT"

            if [[ -n "$VER" ]]; then
              composer require "$PKG:$VER" --no-interaction --no-progress --no-install
              composer update "$PKG" --no-interaction --no-progress --no-install $FLAG
            else
              composer require "$PKG" --no-interaction --no-progress --no-install
              composer update "$PKG" --no-interaction --no-progress --no-install $FLAG
            fi

            NEW_VER="$(composer show --locked "$PKG" 2>/dev/null | awk -F': ' '/^versions/{print $2}' | awk -F', ' '{print $1}' || true)"
            echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes via checksums
        id: changed
        working-directory: ${{ steps.workdir.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          post_json_sha=absent
          post_lock_sha=absent
          [[ -f composer.json ]] && post_json_sha=$(sha256sum composer.json | awk '{print $1}')
          [[ -f composer.lock ]] && post_lock_sha=$(sha256sum composer.lock | awk '{print $1}')

          has_changes=false
          changed_files=""
          if [[ "${{ steps.before.outputs.pre_composer_sha }}" != "$post_json_sha" ]]; then
            has_changes=true
            changed_files="$changed_files composer.json"
          fi
          if [[ "${{ steps.before.outputs.pre_composer_lock_sha }}" != "$post_lock_sha" ]]; then
            has_changes=true
            changed_files="$changed_files composer.lock"
          fi

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "changed_files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Compute PR metadata
        id: meta
        if: ${{ inputs.target == 'pr' }}
        env:
          OLD: ${{ steps.update.outputs.old_version }}
          NEW: ${{ steps.update.outputs.new_version }}
          PKG: ${{ inputs.package }}
          IN_TITLE: ${{ inputs.pr-title }}
          IN_BODY: ${{ inputs.pr-body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${IN_TITLE}" ]]; then
            TITLE="${IN_TITLE}"
          else
            if [[ "$PKG" == "*" ]]; then
              TITLE="chore(composer): update all packages"
            elif [[ -n "${OLD}" && -n "${NEW}" && "${OLD}" != "${NEW}" ]]; then
              TITLE="chore(composer): bump ${PKG} from ${OLD} to ${NEW}"
            elif [[ -n "${NEW}" ]]; then
              TITLE="chore(composer): update ${PKG} to ${NEW}"
            else
              TITLE="chore(composer): update ${PKG}"
            fi
          fi

          if [[ -n "${IN_BODY}" ]]; then
            BODY="${IN_BODY}"
          else
            if [[ "$PKG" == "*" ]]; then
              BODY="This PR updates all Composer packages and refreshes composer.lock (no vendor install)."
            elif [[ -n "${OLD}" && -n "${NEW}" && "${OLD}" != "${NEW}" ]]; then
              BODY="This PR updates ${PKG} from ${OLD} to ${NEW} and refreshes composer.lock (no vendor install)."
            else
              BODY="This PR updates the package constraint and refreshes composer.lock (no vendor install)."
            fi
          fi

          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Commit changes (if any)
        id: commit
        working-directory: ${{ steps.workdir.outputs.path }}
        env:
          FORCE_PR: ${{ inputs['force-pr'] }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          has_changes=${{ steps.changed.outputs.has_changes }}

          if [[ "$has_changes" == "true" || ( "$TARGET" == "pr" && "$FORCE_PR" == "true" ) ]]; then
            git add composer.json composer.lock 2>/dev/null || true
            if [[ "$TARGET" == "pr" ]]; then
              git commit -m "${{ steps.meta.outputs.commit_message }}" || echo "Nothing to commit"
            else
              # In inplace mode we still want a meaningful commit message
              MSG="chore(composer): update ${{ inputs.package }}${{ inputs.version != '' && format(' to {0}', inputs.version) || '' }}"
              git commit -m "$MSG" || echo "Nothing to commit"
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file checksum changes detected; skipping commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push (PR mode)
        if: ${{ inputs.target == 'pr' && steps.commit.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Push (inplace mode)
        if: ${{ inputs.target != 'pr' && steps.commit.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          BR="${{ steps.ctx.outputs.current_branch }}"
          git push origin "HEAD:$BR"

      - name: Open Pull Request (PR mode)
        if: ${{ inputs.target == 'pr' && steps.commit.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          BASE: ${{ inputs['base-branch'] }}
          HEAD: ${{ steps.branch.outputs.name }}
          TITLE: ${{ steps.meta.outputs.title }}
          BODY: ${{ steps.meta.outputs.body }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const base = process.env.BASE;
            const head = process.env.HEAD;
            const title = process.env.TITLE;
            const body = process.env.BODY;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });

            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number} -> ${prs[0].html_url}`);
            } else {
              const res = await github.rest.pulls.create({ owner, repo, title, head, base, body });
              core.info(`Opened PR #${res.data.number}: ${res.data.html_url}`);
            }
