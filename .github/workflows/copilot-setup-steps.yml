name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: xml, bcmath, ctype, curl, dom, gd, intl, mbstring, openssl, pdo_mysql, simplexml, soap, xsl, zip, iconv, xmlwriter, fileinfo, tokenizer

      - name: Cache vendor
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: ./vendor
          key: vendor-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            vendor-

      - name: Install Composer dependencies
        if: ${{ !steps.vendor-cache.outputs.cache-hit }}
        run: composer install --prefer-dist --no-progress --no-interaction
